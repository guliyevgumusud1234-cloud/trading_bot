# Strategy-Specific Parameters Configuration
# Each strategy has its own parameters for ML models and trading logic

# ============================================
# STRATEGY 1: TREND FOLLOWING
# ============================================
trend_following:
  # Model Configuration
  model:
    type: lightgbm
    params:
      objective: multiclass
      num_class: 3  # Long, Neutral, Short
      metric: multi_logloss
      learning_rate: 0.01
      num_leaves: 63
      max_depth: 8
      min_data_in_leaf: 100
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      lambda_l1: 0.1
      lambda_l2: 0.1
      num_iterations: 1000
      early_stopping_rounds: 50
      verbose: -1
  
  # Entry Conditions
  entry:
    # EMA Conditions
    ema_fast: 8
    ema_medium: 21
    ema_slow: 50
    require_ema_alignment: true  # EMA8 > EMA21 > EMA50 for long
    
    # ADX Trend Strength
    adx_period: 14
    adx_threshold: 25  # Min ADX for trend
    
    # Supertrend
    supertrend_period: 10
    supertrend_multiplier: 3
    
    # Volume Confirmation
    volume_ma_period: 20
    volume_threshold: 1.2  # Volume > 1.2x average
    
    # Higher Timeframe Filter
    higher_tf_trend_filter: true
    higher_tf: 1h
  
  # Exit Conditions
  exit:
    # Trailing Stop
    trailing_stop_atr_multiplier: 1.5
    trailing_activation_pct: 0.02  # Activate after 2% profit
    
    # Take Profit
    partial_tp_atr_multiplier: 2  # 50% at 2x ATR
    full_tp_atr_multiplier: 4  # 50% at 4x ATR
    
    # Reverse Signal
    exit_on_reverse_signal: true
  
  # Position Sizing
  position_sizing:
    method: adx_strength  # Based on ADX strength
    adx_ranges:
      - [25, 35, 0.5]  # ADX 25-35: 0.5x base size
      - [35, 50, 1.0]  # ADX 35-50: 1.0x base size
      - [50, 100, 1.5]  # ADX > 50: 1.5x base size
  
  # Stop Loss
  stop_loss:
    type: atr_based
    atr_period: 14
    atr_multiplier: 2.0
    max_loss_pct: 0.02  # 2% hard stop
  
  # Leverage
  max_leverage: 3
  
  # Features (specific to trend following)
  features:
    - ema_8
    - ema_21
    - ema_50
    - ema_100
    - ema_200
    - adx_14
    - di_plus
    - di_minus
    - supertrend
    - macd
    - macd_signal
    - macd_hist
    - volume_ma_20
    - volume_ratio
    - atr_14
    - higher_tf_ema_alignment

# ============================================
# STRATEGY 2: MEAN REVERSION
# ============================================
mean_reversion:
  # Model Configuration
  model:
    type: xgboost
    params:
      objective: multi:softprob
      num_class: 3
      eval_metric: mlogloss
      learning_rate: 0.01
      max_depth: 6
      min_child_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      gamma: 0.1
      reg_alpha: 0.1
      reg_lambda: 1.0
      n_estimators: 500
      early_stopping_rounds: 50
  
  # Entry Conditions
  entry:
    # Bollinger Bands
    bb_period: 20
    bb_std: 2
    bb_lower_threshold: 0.95  # Price below 95% of lower band
    bb_upper_threshold: 1.05  # Price above 105% of upper band
    
    # RSI
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    
    # Z-Score
    z_score_windows: [20, 50, 100]
    z_score_threshold: 2.0  # |z-score| > 2
    
    # Volume
    volume_spike_threshold: 1.5  # Volume > 1.5x average
    
    # Order Book Imbalance
    require_ob_confirmation: true
    ob_imbalance_threshold: 0.1  # 10% imbalance
    
    # Market Regime
    only_in_ranging_market: true
    adx_max: 25  # ADX < 25 for ranging
  
  # Exit Conditions
  exit:
    # Mean Reversion Target
    target: bb_middle  # Exit at BB middle
    
    # Partial Exits
    partial_exit_1_pct: 0.50  # 50% at 50% of distance to mean
    partial_exit_2_pct: 0.50  # 50% at mean
    
    # Stop Loss
    time_based_exit: true
    time_based_hours: 4  # Exit if no mean reversion in 4h
  
  # Position Sizing
  position_sizing:
    method: distance_based  # Based on distance from mean
    max_distance: 0.03  # Max 3% from mean
  
  # Stop Loss
  stop_loss:
    type: fixed_pct
    pct: 0.015  # 1.5% fixed stop
  
  # Leverage
  max_leverage: 2
  
  # Conditions
  conditions:
    no_trade_extreme_funding: true
    funding_threshold: 0.001  # Don't trade if funding > 0.1%
  
  # Features
  features:
    - bb_upper
    - bb_middle
    - bb_lower
    - bb_width
    - bb_position
    - rsi_14
    - rsi_21
    - z_score_20
    - z_score_50
    - z_score_100
    - volume_spike
    - ob_imbalance
    - adx_14
    - distance_from_mean

# ============================================
# STRATEGY 3: MOMENTUM BREAKOUT
# ============================================
momentum_breakout:
  # Model Configuration
  model:
    type: catboost
    params:
      loss_function: MultiClass
      classes_count: 3
      eval_metric: MultiClass
      learning_rate: 0.01
      depth: 6
      l2_leaf_reg: 3
      iterations: 1000
      early_stopping_rounds: 50
      verbose: False
      random_seed: 42
  
  # Entry Conditions
  entry:
    # Consolidation Detection
    consolidation:
      atr_period: 14
      atr_threshold_low: 0.02  # ATR < 2% indicates consolidation
      bb_width_threshold: 0.015  # Tight Bollinger Bands
      min_consolidation_bars: 20  # Min 20 bars of consolidation
    
    # Breakout Confirmation
    breakout:
      volume_multiplier: 2.0  # Volume > 2x average
      momentum_threshold: 0.005  # 0.5% price move
      require_higher_tf_alignment: true
    
    # Liquidation Levels
    liquidation:
      proximity_check: true
      min_distance_pct: 0.01  # 1% away from liquidation levels
    
    # Funding Pressure
    funding:
      use_funding_pressure: true
      extreme_threshold: 0.001  # 0.1%
  
  # Exit Conditions
  exit:
    # Risk-Reward
    min_rr_ratio: 3.0  # 1:3 minimum
    
    # Trailing Stop
    trailing_activation_rr: 1.5  # Activate after 1:1.5
    trailing_atr_multiplier: 1.0
    
    # Stop Loss
    sl_below_consolidation: true
    consolidation_buffer_pct: 0.005  # 0.5% below/above consolidation
  
  # Position Sizing
  position_sizing:
    method: volatility_adjusted  # Lower vol = higher size
    inverse_volatility: true
  
  # Stop Loss
  stop_loss:
    type: consolidation_based
    max_loss_pct: 0.02  # 2% hard stop
  
  # Leverage
  max_leverage: 5  # Aggressive strategy
  
  # Features
  features:
    - atr_14
    - bb_width
    - consolidation_score
    - volume_breakout
    - price_momentum
    - higher_tf_trend
    - liquidation_distance
    - funding_rate
    - funding_momentum
    - ob_depth_ratio

# ============================================
# STRATEGY 4: FUNDING ARBITRAGE
# ============================================
funding_arbitrage:
  # Model Configuration (Statistical, not ML)
  model:
    type: statistical
  
  # Entry Conditions
  entry:
    # Funding Rate Thresholds
    extreme_positive: 0.001  # > 0.1% (short futures, long spot)
    extreme_negative: -0.001  # < -0.1% (long futures, short spot)
    
    # Basis
    basis_threshold: 0.002  # Spot-futures basis
    
    # Liquidity Requirements
    min_spot_liquidity: 100000  # $100k
    min_futures_liquidity: 100000  # $100k
  
  # Exit Conditions
  exit:
    # Funding Normalization
    funding_normal_threshold: 0.0003  # Exit when funding < 0.03%
    
    # Time-based
    max_hold_periods: 3  # Max 3 funding periods (24h)
    
    # Basis convergence
    basis_converge_threshold: 0.0005  # Exit when basis < 0.05%
  
  # Execution
  execution:
    hedge_type: spot_futures  # or futures_futures
    collect_funding: true
    funding_frequency_hours: 8
  
  # Position Sizing
  position_sizing:
    method: fixed
    min_position_usd: 10000  # $10k minimum for profitable funding
  
  # Leverage
  max_leverage: 1  # Low risk, low leverage
  
  # Conditions
  conditions:
    only_high_liquidity_pairs: true
    require_hedge_available: true
  
  # Risk
  risk:
    basis_risk_max: 0.005  # 0.5% max basis risk
    liquidation_distance_min: 0.50  # Stay 50% away from liquidation

# ============================================
# STRATEGY 5: DEEP RL (PPO)
# ============================================
deep_rl:
  # Model Configuration
  model:
    type: ppo
    algorithm: stable_baselines3
    
    # OPTIMIZED PPO Hyperparameters
    params:
      learning_rate: 0.00005  # Much lower (was 0.0003)
      n_steps: 512  # Smaller batch (was 2048)
      batch_size: 64
      n_epochs: 10
      gamma: 0.99
      gae_lambda: 0.95
      clip_range: 0.2
      clip_range_vf: null
      ent_coef: 0.1  # Higher exploration (was 0.01/0.05)
      vf_coef: 0.5
      max_grad_norm: 0.5
      normalize_advantage: true
      use_sde: false
      tensorboard_log: ./logs/tensorboard/
      verbose: 1
  
  # Network Architecture
  network:
    policy: MlpPolicy
    shared_layers: [512, 256, 128]
    actor_layers: [64, 32]
    critic_layers: [64, 32]
    activation: relu
    use_layer_norm: true
    dropout: 0.3
  
  # Environment Configuration
  environment:
    initial_balance: 10000
    max_leverage: 2  # REDUCED from 5x to 2x
    transaction_fee: 0.0004
    max_position_size: 0.5  # Max 50% of capital per trade
    lookback_window: 50  # Reduced feature window
    
    # State Space (SIMPLIFIED)
    state:
      num_features: 50  # Reduced from 200+
      include_position_info: true
    
    # Action Space (SIMPLIFIED)
    actions:
      type: discrete
      num_actions: 3  # 0=Close/Hold, 1=Long, 2=Short
  
  # Training
  training:
    total_timesteps: 500000  # Reduced for faster testing (was 2M)
    eval_freq: 10000
    eval_episodes: 10
    save_freq: 50000
    
    # Early Stopping
    early_stopping:
      enabled: true
      patience: 5  # 5 evaluations without improvement
      min_sharpe: 0.5
  
  # Inference
  inference:
    deterministic: true  # Use mean action, not sample
    confidence_threshold: 0.6  # Min confidence to trade
  
  # Features (uses all 200+ features)
  use_all_features: true

# ============================================
# META-STRATEGY (ORCHESTRATOR)
# ============================================
meta_strategy:
  # Model Configuration
  model:
    type: lightgbm
    params:
      objective: regression
      metric: rmse
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 5
      feature_fraction: 0.9
      bagging_fraction: 0.9
      bagging_freq: 5
      verbose: -1
  
  # Input Features
  features:
    # Market Regime
    - volatility_regime  # low, med, high
    - trend_strength  # ADX
    - market_direction  # bullish, bearish, neutral
    - volume_regime  # high, normal, low
    - funding_regime  # extreme positive, negative, normal
    
    # Strategy Performance (recent)
    - strategy_sharpe_7d
    - strategy_sharpe_30d
    - strategy_win_rate_7d
    - strategy_win_rate_30d
    - strategy_drawdown
    - strategy_profit_factor
    
    # Correlation
    - strategy_correlation_matrix
    - portfolio_diversification_score
    
    # Market Health
    - liquidity_score
    - spread_quality
    - execution_quality
  
  # Allocation Logic
  allocation:
    # Rebalancing
    rebalance_frequency: 1h  # Rebalance every hour
    min_weight_change: 0.05  # Only rebalance if weight changes > 5%
    
    # Constraints
    min_weight: 0.0  # Can go to zero
    max_weight: 0.6  # Max 60% in single strategy
    
    # Regime-based (predefined, can be overridden by model)
    use_model_allocation: true
    fallback_to_regime_based: true
  
  # Risk Adjustments
  risk_adjustments:
    reduce_on_high_volatility: true
    volatility_reduction_factor: 0.5
    
    boost_arbitrage_on_extreme_funding: true
    extreme_funding_arb_weight: 0.5
    
    risk_off_on_drawdown: true
    risk_off_threshold: 0.15  # 15% DD

# ============================================
# COMMON SETTINGS
# ============================================
common:
  # Feature Importance
  track_feature_importance: true
  importance_update_frequency: 7  # days
  
  # Model Versioning
  save_models: true
  model_save_path: ./models/
  keep_n_versions: 5  # Keep last 5 versions
  
  # Logging
  log_predictions: true
  log_features: false  # Too verbose, only for debugging
  log_performance: true

# ============================================
# HYPERPARAMETER OPTIMIZATION (OPTUNA)
# ============================================
optimization:
  enabled: false  # Enable for hyperparameter tuning
  
  optuna:
    n_trials: 100
    timeout: 3600  # 1 hour
    n_jobs: 4  # Parallel trials
    
    # Objective
    objective: sharpe_ratio  # or profit_factor, win_rate
    direction: maximize
    
    # Search Space (example for LightGBM)
    search_space:
      learning_rate: [0.001, 0.1]  # log scale
      num_leaves: [20, 100]
      max_depth: [3, 12]
      min_data_in_leaf: [20, 200]
      feature_fraction: [0.6, 1.0]
      bagging_fraction: [0.6, 1.0]

