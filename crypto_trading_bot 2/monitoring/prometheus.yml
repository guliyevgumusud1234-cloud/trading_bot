# Prometheus Configuration for Trading Bot

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'crypto-trading-bot'
    environment: 'production'

# Alerting
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Rule files
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Trading Bot Metrics
  - job_name: 'trading_bot'
    static_configs:
      - targets: ['trading_bot:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TimescaleDB Exporter (if configured)
  - job_name: 'postgres'
    static_configs:
      - targets: []
        # - 'postgres-exporter:9187'

  # Redis Exporter (if configured)
  - job_name: 'redis'
    static_configs:
      - targets: []
        # - 'redis-exporter:9121'

  # Node Exporter for system metrics (if configured)
  - job_name: 'node'
    static_configs:
      - targets: []
        # - 'node-exporter:9100'

